name: Refresh dependency verification metadata

on:
  push:
    branches:
      - feat/initial-paper-implementation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-metadata-${{ github.sha }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true
      - name: Generate candidate SHA-256 verification metadata
        run: ./gradlew --write-verification-metadata sha256 --no-daemon --warning-mode all clean test build
      - name: Upload candidate metadata for maintainer review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-verification-metadata-${{ github.sha }}
          path: gradle/verification-metadata.xml
          if-no-files-found: error
          retention-days: 3
