name: CI

on:
  push:
    branches:
      - principal
  pull_request:
    branches:
      - principal
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, and validate metadata (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify Gradle Wrapper JAR checksum
        run: echo '621008afc4f5d59357fcf06ffa644dd5aade5e091bdc363742710445f73cdaf8  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Validate YAML and JSON metadata
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; ARGV.each { |file| YAML.parse_file(file) }' \
            .github/dependabot.yml .github/workflows/*.yml \
            src/main/resources/config.yml src/main/resources/plugin.yml
          python3 -m json.tool .release-please-config.json >/dev/null
          python3 -m json.tool .release-please-manifest.json >/dev/null
      - name: Lint GitHub Actions workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.11 -color
      - name: Bootstrap Gradle dependency verification metadata
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/initial-paper-implementation' && hashFiles('gradle/verification-metadata.xml') == '' }}
        run: ./gradlew --no-daemon --write-verification-metadata sha256 --warning-mode all clean test build
      - name: Commit generated dependency verification metadata
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/initial-paper-implementation' && hashFiles('gradle/verification-metadata.xml') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          cp gradle/verification-metadata.xml "$RUNNER_TEMP/verification-metadata.xml"
          git fetch origin "$HEAD_REF"
          git checkout -B "$HEAD_REF" "origin/$HEAD_REF"
          mkdir -p gradle
          cp "$RUNNER_TEMP/verification-metadata.xml" gradle/verification-metadata.xml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/verification-metadata.xml
          if git diff --cached --quiet; then
            echo "Dependency verification metadata is already current."
            exit 0
          fi
          git commit -m "build: add Gradle dependency verification metadata"
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH" push origin "$HEAD_REF"
      - name: Run tests and build plugin
        run: ./gradlew --no-daemon --warning-mode all clean test build
      - name: Upload plugin JAR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcraft-voice-chat-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
